name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the musical or workflow problem you want to solve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working in Solomon?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, references, genres, other plugins that do something similar.
