name: Build Solomon

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitizers:
    # engine tests with AddressSanitizer + UndefinedBehaviorSanitizer (fast, no JUCE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test the engine with sanitizers
        run: |
          cmake -B build -DSOLOMON_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DSOLOMON_BUILD_PLUGIN_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (engine, plus plugin smoke test on Windows)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate the VST 3 with pluginval (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          echo "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab *pluginval.zip" | sha256sum -c -
          unzip -q pluginval.zip
          bundle="$(find build -type d -name Solomon.vst3 | head -1)"
          echo "Validating $bundle"
          ./pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --validate "$bundle"

      - name: Validate the VST 3 with pluginval (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          bundle="$(find build -type d -name Solomon.vst3 | head -1)"
          echo "Validating $bundle"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --validate "$bundle"

      - name: Collect plugin bundles
        shell: bash
        run: |
          mkdir -p out
          find build -type d \( -name "Solomon.vst3" -o -name "Solomon.component" \) -prune -exec cp -R {} out/ \;
          cp LICENSE out/LICENSE.txt
          ls -la out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Solomon-${{ matrix.name }}
          path: out

  release:
    # runs only when a version tag is pushed (e.g. v0.2.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sanitizers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Create zip files
        run: |
          cd dist
          for d in Solomon-*; do (cd "$d" && zip -qr "../$d-${GITHUB_REF_NAME}.zip" .); done
          ls -la

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.zip
          generate_release_notes: true
